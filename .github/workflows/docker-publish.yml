name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "ServerDocker/**"
      - ".github/workflows/docker-publish.yml"

env:
  REGISTRY: ghcr.io
  # Hardcoded rather than derived from github.repository, which tracks the
  # repo's current name - a rename would otherwise silently start publishing
  # to a different, brand-new package instead of the one deployments pull.
  IMAGE_NAME: acelven/discord-soundboard-integration-icue-xeneonedge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ServerDocker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
