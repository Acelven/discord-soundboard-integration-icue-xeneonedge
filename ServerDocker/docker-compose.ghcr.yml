# Secrets come from .env in this directory (gitignored) - copy .env.example
# to .env and fill in real values before running `docker compose pull/up`.
services:
  discord-sound-agent:
    image: ghcr.io/acelven/discord-soundboard-integration-icue-xeneonedge:latest
    container_name: DiscordGoofyBot
    restart: unless-stopped
    cpuset: "1,2,3,9,10,11"
    ports:
      - "8766:8766"
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - API_KEY=${API_KEY}                # optional but recommended on LAN
    # - IDLE_TIMEOUT_SEC=14400            # auto-disconnect after inactivity (default 4h)
      - ADMIN_USERNAME=${ADMIN_USERNAME}  # dashboard (/dashboard) bootstrap admin username
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}  # bootstrap admin password; if unset, a random one
    #                                       is generated and printed to the logs on first
    #                                       boot. Only used the first time /data/users.json
    #                                       doesn't exist yet - ignored after that.
    # - MAX_LOCAL_SOUND_SECONDS=15        # max length of an uploaded/transferred local sound
    # - MAX_UPLOAD_BYTES=5000000          # max upload size for the local sound library
    volumes:
      - /mnt/user/appdata/discord-sound-agent:/data
